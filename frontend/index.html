<!doctype html>
<html lang="fr" data-atelier-app="cuisine" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>atelier_Cuisine</title>
    <meta name="description" content="Liste de courses, repas, idées de plats et alertes de péremption." />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cuisine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1013" />
    <script>
      // Anti-flash : pose le thème choisi dans les réglages (néon par défaut) avant le premier rendu.
      // Même logique que appliquerTheme (src/lib/donnees.tsx).
      (function () {
        var theme = "dark";
        try {
          theme = JSON.parse(localStorage.getItem("atelier.reglages") || "{}").theme || "dark";
        } catch (e) {}
        if (theme === "auto") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (theme !== "light") theme = "dark";
        var racine = document.documentElement;
        racine.setAttribute("data-theme", theme);
        racine.classList.toggle("dark", theme === "dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0f1013" : "#f5f5f8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

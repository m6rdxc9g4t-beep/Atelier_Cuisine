  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fond)" filter="url(#ombre)"/>
  <g transform="translate(275.5 275.5) scale(19.7)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
